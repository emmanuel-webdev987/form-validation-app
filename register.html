<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
</head>
<body>
    <form id="form">
    Username
    <input
    id="username"
    type="text"
    name="Username"
   placeholder="enter Username"><br>
   Email
    <input
    id="email"
    type="email"
    name="email"
   placeholder="enter email"><br>

   password
    <input
    id="password"
    type="password"
    name="password"
   placeholder="enter password">
   <button type="button" id="togglePassword">Show</button>

   <br>

   confirm Password
    <input
    id="confirmPassword"
    type="password"
    name="confirm password"
   placeholder="confirm password"><button type="button" id="toggleConfirm">Show</button>

   <br>

      
   <button type="submit">register</button>
   <p id="message"></p>
       </form>
       <script src="register.js"></script>
</body>
</html>
